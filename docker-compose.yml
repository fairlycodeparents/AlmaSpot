version: "3.8"

services:
  mongo:
    image: mongo:8.2
    container_name: almaspot-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}
      - MONGO_INITDB_DATABASE=${MONGO_DB_NAME}
    networks:
      - almaspot-network

  unibo-provider:
    build:
      context: ./unibo-provider
      dockerfile: Dockerfile
    container_name: almaspot-unibo-provider
    ports:
      - "8080:8080"
    networks:
      - almaspot-network
    restart: unless-stopped

networks:
  almaspot-network:
    driver: bridge

  mongo-express:
    image: mongo-express
    restart: always
    ports:
      - 8081:8081
    environment:
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: password
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_USER}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_PASSWORD}
      ME_CONFIG_MONGODB_SERVER: mongo

volumes:
  mongo_data:
