name: Docker Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  packages: write
  contents: read

jobs:
  docker-publish:
    name: Docker Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Docker Tag
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" == "release" ]; then
            echo "TAG_NAME=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
            echo "Mode: caused by release event"
          else
            LATEST_TAG=$(gh release view --json tagName --jq .tagName --repo ${{ github.repository }})
            echo "TAG_NAME=$LATEST_TAG" >> $GITHUB_OUTPUT
            echo "Mode: manual"
          fi

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./server
          push: true
          tags: |
            ghcr.io/fairlycodeparents/almaspot-server:latest
            ghcr.io/fairlycodeparents/almaspot-server:${{ steps.tag.outputs.TAG_NAME }}
          cache-from: type=gha
          cache-to: type=gha,mode=max